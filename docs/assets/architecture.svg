<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <style>
      .band     { fill:#f4f4f1; stroke:#e1e0d9; stroke-width:1; rx:14 }
      .bandlbl  { fill:#898781; font-size:12px; font-weight:700; letter-spacing:.09em }
      .bandsub  { fill:#898781; font-size:12.5px }
      .box      { fill:#fcfcfb; stroke:#2a78d6; stroke-width:2; rx:10 }
      .boxext   { fill:#fcfcfb; stroke:#eb6834; stroke-width:2; rx:10 }
      .boxstore { fill:#fcfcfb; stroke:#2a78d6; stroke-width:2; rx:10; stroke-dasharray:0 }
      .title    { fill:#0b0b0b; font-size:14.5px; font-weight:650 }
      .titleext { fill:#0b0b0b; font-size:14.5px; font-weight:650 }
      .svc      { fill:#2a78d6; font-size:10.5px; font-weight:700; letter-spacing:.07em }
      .svcext   { fill:#eb6834; font-size:10.5px; font-weight:700; letter-spacing:.07em }
      .desc     { fill:#52514e; font-size:12.5px }
      .flow     { stroke:#52514e; stroke-width:1.6; fill:none }
      .flowblue { stroke:#2a78d6; stroke-width:1.6; fill:none; stroke-dasharray:5 4 }
      .flowlbl  { fill:#52514e; font-size:11.5px }
    </style>
  </defs>

  <rect width="960" height="820" fill="#fcfcfb"/>

  <!-- ══ BAND A ══════════════════════════════════════════════════════ -->
  <rect class="band" x="16" y="16" width="928" height="420"/>
  <text class="bandlbl" x="40" y="46">STEP 1 — COLLECTING THE DATA</text>
  <text class="bandsub" x="40" y="66">Runs by itself every 6 hours. No person is involved.</text>

  <!-- Cursor API -->
  <rect class="boxext" x="352" y="92" width="256" height="72"/>
  <text class="svcext" x="372" y="117">OUTSIDE YOUR COMPANY</text>
  <text class="titleext" x="372" y="138">Cursor Admin API</text>
  <text class="desc" x="372" y="155">Where the spend data comes from</text>

  <!-- Scheduler -->
  <rect class="box" x="40" y="212" width="238" height="84"/>
  <text class="svc" x="60" y="237">CLOUD SCHEDULER</text>
  <text class="title" x="60" y="258">The alarm clock</text>
  <text class="desc" x="60" y="276">Wakes up at 00:00, 06:00,</text>
  <text class="desc" x="60" y="291">12:00 and 18:00 IST</text>

  <!-- Ingest job -->
  <rect class="box" x="352" y="212" width="256" height="84"/>
  <text class="svc" x="372" y="237">CLOUD RUN — JOB</text>
  <text class="title" x="372" y="258">The collector</text>
  <text class="desc" x="372" y="276">Wakes, fetches, saves, stops.</text>
  <text class="desc" x="372" y="291">Nothing can reach it from outside.</text>

  <!-- Secret Manager -->
  <rect class="box" x="682" y="212" width="238" height="84"/>
  <text class="svc" x="702" y="237">SECRET MANAGER</text>
  <text class="title" x="702" y="258">The key safe</text>
  <text class="desc" x="702" y="276">Holds the Cursor API key</text>
  <text class="desc" x="702" y="291">so it is never in the code</text>

  <!-- BigQuery -->
  <rect class="boxstore" x="352" y="336" width="256" height="80"/>
  <text class="svc" x="372" y="361">BIGQUERY</text>
  <text class="title" x="372" y="382">The filing cabinet</text>
  <text class="desc" x="372" y="400">Every call ever made, kept forever</text>

  <!-- Arrows in band A -->
  <path class="flow" d="M 480 164 L 480 208" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="490" y="192">reads</text>

  <path class="flow" d="M 278 254 L 348 254" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="284" y="245">starts it</text>

  <path class="flow" d="M 682 254 L 612 254" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="622" y="245">unlocks</text>

  <path class="flow" d="M 480 296 L 480 332" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="490" y="318">writes</text>

  <!-- ══ BAND B ══════════════════════════════════════════════════════ -->
  <rect class="band" x="16" y="460" width="928" height="344"/>
  <text class="bandlbl" x="40" y="490">STEP 2 — LOOKING AT THE DATA</text>
  <text class="bandsub" x="40" y="510">Happens only when someone opens the page.</text>

  <!-- Person -->
  <rect class="boxext" x="40" y="560" width="238" height="88"/>
  <text class="svcext" x="60" y="585">PEOPLE</text>
  <text class="titleext" x="60" y="606">CX, finance, engineers</text>
  <text class="desc" x="60" y="624">Open a normal web address</text>

  <!-- IAP -->
  <rect class="box" x="352" y="560" width="256" height="88"/>
  <text class="svc" x="372" y="585">IDENTITY-AWARE PROXY</text>
  <text class="title" x="372" y="606">The doorman</text>
  <text class="desc" x="372" y="624">Google login. No account, no entry.</text>

  <!-- Dashboard service -->
  <rect class="box" x="682" y="560" width="238" height="88"/>
  <text class="svc" x="702" y="585">CLOUD RUN — SERVICE</text>
  <text class="title" x="702" y="606">The dashboard</text>
  <text class="desc" x="702" y="624">Draws the page.</text>
  <text class="desc" x="702" y="641">Cannot change any data.</text>

  <path class="flow" d="M 278 600 L 348 600" marker-end="url(#arrow)"/>
  <path class="flow" d="M 608 600 L 678 600" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="286" y="591">visits</text>
  <text class="flowlbl" x="614" y="591">if allowed</text>

  <!-- Service reads BigQuery -->
  <path class="flowblue" d="M 801 556 L 801 376 L 612 376" marker-end="url(#arrowBlue)"/>
  <text class="flowlbl" x="700" y="368" fill="#2a78d6">reads only</text>

  <text class="bandsub" x="40" y="690">The two halves never talk to each other directly. The collector can only write;</text>
  <text class="bandsub" x="40" y="710">the dashboard can only read. Neither can do the other&#8217;s job, by design.</text>
  <text class="bandsub" x="40" y="742">Everything inside the boxes lives in one Google Cloud project, in a region you choose.</text>
</svg>
